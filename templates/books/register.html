{% extends "base.html" %}

{% block title %}Create Account — Bookboxd{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-parchment-200 space-y-6">
        <div class="text-center space-y-1">
            <span class="text-2xl">✨</span>
            <h1 class="text-2xl font-serif font-bold text-stone-900">Join Bookboxd</h1>
            <p class="text-xs text-stone-500">Your social book diary, shelves, and reading community.</p>
        </div>

        <form action="{% url 'register' %}" method="POST" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">Username *</label>
                <input type="text" name="username" required placeholder="Choose a username"
                       class="w-full text-sm bg-parchment-50 border border-stone-300 rounded-lg px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition"
                       autofocus>
            </div>

            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">Email Address</label>
                <input type="email" name="email" placeholder="you@example.com"
                       class="w-full text-sm bg-parchment-50 border border-stone-300 rounded-lg px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">Password *</label>
                <input type="password" name="password" required placeholder="At least 6 characters"
                       class="w-full text-sm bg-parchment-50 border border-stone-300 rounded-lg px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">Confirm Password *</label>
                <input type="password" name="password_confirm" required placeholder="Re-type password"
                       class="w-full text-sm bg-parchment-50 border border-stone-300 rounded-lg px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition">
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-stone-950 font-bold text-sm py-3 rounded-xl shadow transition">
                Create Free Account
            </button>
        </form>

        <div class="text-center text-xs text-stone-500 pt-2 border-t border-stone-100">
            Already have an account?
            <a href="{% url 'login' %}" class="text-amber-800 font-bold hover:underline">
                Sign in &rarr;
            </a>
        </div>
    </div>
</div>
{% endblock %}
