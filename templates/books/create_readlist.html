{% extends "base.html" %}

{% block title %}Create New Readlist — Bookboxd{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-parchment-200 space-y-6">
        <div>
            <a href="{% url 'my_readlists' %}" class="text-xs text-amber-700 font-bold hover:underline block mb-2">
                &larr; Back to Shelves
            </a>
            <h1 class="text-2xl font-serif font-bold text-stone-900">Create a Custom Readlist</h1>
            <p class="text-xs text-stone-500 mt-1">
                Group books into themed collections like "Best Sci-Fi of 2024", "Beach Reads", or "Books to Buy".
            </p>
        </div>

        <form action="{% url 'create_readlist' %}" method="POST" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">List Name *</label>
                <input type="text" name="name" required placeholder="e.g. Essential Dystopian Fiction"
                       class="w-full text-sm bg-parchment-50 border border-stone-300 rounded-lg px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">Description (Optional)</label>
                <textarea name="description" rows="3" placeholder="Brief note explaining the vibe or theme of this list..."
                          class="w-full text-sm bg-parchment-50 border border-stone-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition"></textarea>
            </div>

            <div class="flex items-center gap-2 pt-1">
                <input type="checkbox" name="is_public" id="is_public" checked
                       class="w-4 h-4 text-amber-600 rounded border-stone-300 focus:ring-amber-500">
                <label for="is_public" class="text-xs text-stone-700 font-medium">
                    Make this list public (visible to friends and on your profile)
                </label>
            </div>

            <div class="pt-2 flex justify-end gap-3">
                <a href="{% url 'my_readlists' %}" class="px-4 py-2 rounded-lg text-xs font-semibold text-stone-600 hover:bg-stone-100 transition">
                    Cancel
                </a>
                <button type="submit" class="bg-bookbrown-800 hover:bg-bookbrown-700 text-amber-400 font-bold text-xs px-6 py-2.5 rounded-lg shadow transition">
                    Create Readlist
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
