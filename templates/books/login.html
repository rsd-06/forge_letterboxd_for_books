{% extends "base.html" %}

{% block title %}Sign In — Bookboxd{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-parchment-200 space-y-6">
        <div class="text-center space-y-1">
            <span class="text-2xl">📖</span>
            <h1 class="text-2xl font-serif font-bold text-stone-900">Sign in to Bookboxd</h1>
            <p class="text-xs text-stone-500">Track your readlists, rate books, and connect with friends.</p>
        </div>

        <form action="{% url 'login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" method="POST" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">Username</label>
                <input type="text" name="username" required placeholder="your username"
                       class="w-full text-sm bg-parchment-50 border border-stone-300 rounded-lg px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition"
                       autofocus>
            </div>

            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full text-sm bg-parchment-50 border border-stone-300 rounded-lg px-3.5 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition">
            </div>

            <button type="submit" class="w-full bg-bookbrown-800 hover:bg-bookbrown-700 text-amber-400 font-bold text-sm py-3 rounded-xl shadow transition">
                Sign In
            </button>
        </form>

        <div class="text-center text-xs text-stone-500 pt-2 border-t border-stone-100">
            Don't have an account yet?
            <a href="{% url 'register' %}" class="text-amber-800 font-bold hover:underline">
                Create one free &rarr;
            </a>
        </div>
    </div>
</div>
{% endblock %}
